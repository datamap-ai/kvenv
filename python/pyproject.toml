[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvenv"
version = "0.1.0"
description = "Load an application's secrets from an Azure Key Vault into the environment at runtime."
requires-python = ">=3.10"
dependencies = [
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
]

[project.scripts]
kvenv = "kvenv.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kvenv*"]
